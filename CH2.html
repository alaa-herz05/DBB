<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Database Design – Chapter 2 Study Guide</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0714;--p1:#130d22;--p2:#1a1230;--line:#2c2150;--a:#c4a7ff;--a2:#9b6bff;--ad:#5b3bb0;--t:#ece6fa;--m:#a99cc9;--bad:#ff7b9c;--ok:#7be0b0;
box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.7 "IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;
background-image:radial-gradient(rgba(196,167,255,.09) 1px,transparent 1px);background-size:26px 26px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{margin:0;line-height:1.25}
.mono,.tag{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,7,20,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}
nav a{color:var(--m);text-decoration:none;white-space:nowrap;padding:5px 13px;border-radius:99px;font-size:14px;border:1px solid transparent}
nav a:hover,nav a:focus-visible{color:var(--a);border-color:var(--ad);outline:none}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:52px 0 34px}
.hero h1{font-size:clamp(32px,6vw,52px);color:var(--a);text-shadow:0 0 30px rgba(155,107,255,.45)}
.hero p{color:var(--m);max-width:48ch}
.tag{display:inline-block;font-size:12px;color:var(--a2);border:1px solid var(--ad);border-radius:6px;padding:2px 10px;margin-bottom:12px;direction:ltr}
.btn{display:inline-block;background:var(--a2);color:#12081f;border:0;border-radius:9px;padding:10px 20px;margin:4px 0 4px 8px;cursor:pointer;font:600 15px "IBM Plex Sans Arabic",sans-serif;text-decoration:none}
.btn.o{background:transparent;color:var(--a);border:1px solid var(--ad)}
.btn:hover{box-shadow:0 0 18px rgba(155,107,255,.55)}
.btn:focus-visible,.opt:focus-visible,summary:focus-visible,.chip:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.db{display:grid;place-items:center}
.db svg{width:min(260px,70vw);filter:drop-shadow(0 0 26px rgba(155,107,255,.5))}
.db .r{animation:pl 2.4s infinite}.db .r:nth-of-type(2){animation-delay:.5s}.db .r:nth-of-type(3){animation-delay:1s}
@keyframes pl{50%{opacity:.35}}
section{padding:40px 0 6px}
h2{font-size:clamp(25px,4vw,34px);color:var(--a)}
.lead{color:var(--m);margin:4px 0 18px}
.card{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.card h3{font-size:19px;color:var(--a);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.grid .card{margin:0}
ul{margin:6px 0;padding:0 20px 0 0}li{margin:4px 0}
b{color:var(--a)}
.tip{border-right:3px solid var(--a2);background:rgba(155,107,255,.09);padding:10px 14px;border-radius:8px 0 0 8px;margin:12px 0;font-size:15.5px}
.en{direction:ltr;unicode-bidi:isolate}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:#120b22;color:var(--t);border:1px solid var(--ad);border-radius:99px;padding:6px 14px;cursor:pointer;font:500 14px "JetBrains Mono",monospace}
.chip.on{background:var(--a2);color:#12081f;border-color:var(--a)}
.out{min-height:64px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;direction:ltr;text-align:left}
th,td{border:1px solid var(--line);padding:8px 12px;font-family:"JetBrains Mono",monospace;font-size:13.5px}
th{background:#21153f;color:var(--a)}tr.hl td{background:rgba(155,107,255,.28);color:#fff}tbody tr{cursor:pointer}
svg.er{width:100%;height:auto;direction:ltr;background:#0d081a;border:1px solid var(--line);border-radius:12px}
.er text{font:600 11px "JetBrains Mono",monospace;fill:var(--t);text-anchor:middle}
.er .n rect{fill:#1d1238;stroke:var(--a2);stroke-width:1.6}
.er .e{stroke:var(--a2);stroke-width:1.8;fill:none}.er .lb rect{fill:#0d081a;stroke:var(--ad)}.er .lb text{fill:var(--a);font-size:10px}
.er .cur .e{stroke:#fff;stroke-width:2.6}.er .cur .lb rect{fill:var(--a2)}.er .cur .lb text{fill:#12081f}
.er .n,.er .ed{transition:opacity .4s}
details{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
summary{cursor:pointer;padding:13px 18px;font-weight:600;color:var(--a);list-style:none}
summary::before{content:"◂ ";color:var(--a2)}details[open] summary::before{content:"▾ "}
details>div{padding:0 20px 14px}
select{background:#120b22;color:var(--t);border:1px solid var(--ad);border-radius:8px;padding:7px 10px;font:600 15px "JetBrains Mono",monospace;margin:0 0 0 8px}
#bar{height:8px;background:#150e29;border-radius:9px;overflow:hidden;margin:10px 0}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ad),var(--a));transition:width .4s}
.q{background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.q p{margin:0 0 10px;font-weight:600}.q small{color:var(--m);font-weight:400}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:#0e0820;color:var(--t);font:inherit;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--a);background:#1a1033}
.opt.ok{background:rgba(123,224,176,.18);border-color:var(--ok)}.opt.no{background:rgba(255,123,156,.16);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{display:none;margin-top:8px;padding:10px 14px;border-radius:8px;font-size:15.5px}
.fb.show{display:block}.fb.ok{background:rgba(123,224,176,.1);border-right:3px solid var(--ok)}.fb.no{background:rgba(255,123,156,.1);border-right:3px solid var(--bad)}
#score{font:700 22px "JetBrains Mono",monospace;color:var(--a);direction:ltr;display:inline-block}
footer{padding:36px 18px 60px;text-align:center;color:var(--m);font-size:14px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

#ar{display:none}body.ar #ar{display:block}body.ar #en{display:none}
#en{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px}
nav .btn{flex:none;margin:0 0 0 8px;padding:5px 16px;font-size:14px}#en nav .btn{margin:0 8px 0 0}
#en .btn{margin:4px 8px 4px 0}#en ul{padding:0 0 0 20px}
#en .tip{border-right:0;border-left:3px solid var(--a2);border-radius:0 8px 8px 0}
#en .fb.ok,#en .fb.no{border-right:0}#en .fb.ok{border-left:3px solid var(--ok)}#en .fb.no{border-left:3px solid var(--bad)}
#en summary::before{content:"▸ "}#en details[open] summary::before{content:"▾ "}#en .opt{text-align:left}

.key{display:inline-flex;align-items:center;gap:6px;margin:4px 6px 4px 0;padding:6px 12px;border:1px solid var(--ad);border-radius:99px;cursor:pointer;font:500 13.5px "JetBrains Mono",monospace;background:#120b22;direction:ltr}
.key input{accent-color:#9b6bff}.pk{text-decoration:underline;color:var(--a)}
td button{background:#120b22;color:var(--t);border:1px solid var(--ad);border-radius:6px;padding:2px 8px;cursor:pointer;font:600 12px "JetBrains Mono",monospace}
tr.bad td{background:rgba(255,123,156,.2)}tr.gone{opacity:.3;text-decoration:line-through}
</style>
</head>
